      <stop offset="1" stop-color="#07152F" stop-opacity="0"/>
    </radialGradient>
    <filter id="bodyShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dx="20" dy="28" result="blur"/>
      <feFlood flood-color="#0C1730" flood-opacity=".25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
      </feMerge>
    </filter>
    <filter id="tailShadow" x="-45%" y="-45%" width="190%" height="210%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="200%">
