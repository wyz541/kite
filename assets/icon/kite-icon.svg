    <path transform="translate(-12 -16)" d="M505 670 C481 744 552 788 641 772 C736 755 820 782 846 840" fill="none" stroke="#FFF3E5" stroke-opacity=".5" stroke-width="3.2" stroke-linecap="round"/>
