<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Kite Twin Flow icon</title>
  <desc>A transparent glass delta kite in orange and navy with twin data ribbons and a steel tail spool.</desc>
  <defs>
    <linearGradient id="leftSail" x1="170" y1="110" x2="500" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF5DE" stop-opacity=".98"/>
      <stop offset=".22" stop-color="#FFD88F" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#FFB14F" stop-opacity=".93"/>
      <stop offset=".72" stop-color="#F47A32" stop-opacity=".94"/>
      <stop offset="1" stop-color="#A9341B" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="rightSail" x1="870" y1="260" x2="610" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42649C"/>
      <stop offset=".28" stop-color="#2B4A83"/>
      <stop offset=".56" stop-color="#1C3568"/>
      <stop offset=".82" stop-color="#10254D"/>
      <stop offset="1" stop-color="#08152F"/>
    </linearGradient>
    <linearGradient id="rim" x1="180" y1="130" x2="770" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE5A8"/>
      <stop offset=".37" stop-color="#F59A42"/>
      <stop offset=".62" stop-color="#D35423"/>
      <stop offset=".82" stop-color="#5A6D9E"/>
      <stop offset="1" stop-color="#101F42"/>
    </linearGradient>
    <linearGradient id="tailA" x1="490" y1="655" x2="845" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A2A19"/>
      <stop offset=".55" stop-color="#D65728"/>
      <stop offset="1" stop-color="#FF9D45"/>
    </linearGradient>
    <linearGradient id="tailB" x1="515" y1="665" x2="865" y2="895" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1934"/>
      <stop offset=".55" stop-color="#203C75"/>
      <stop offset="1" stop-color="#6587C2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(300 265) rotate(38) scale(450 270)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
