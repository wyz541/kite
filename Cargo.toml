[package]
name = "kite-explorer"
version = "0.5.0"
edition = "2024"
description = "A fast, native cross-platform file manager built with Rust and GPUI"
license = "MIT"
build = "build.rs"

[lib]
name = "kite_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]

[features]
uniffi-bindgen = ["uniffi/cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
dirs = "6"
open = "5"
thiserror = "2"
trash = "5"
uniffi = "0.32.2"
walkdir = "2"

[target.'cfg(target_os = "windows")'.dependencies]
gpui-kit = "0.8.0"
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.39.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
panic = "abort"
strip = "symbols"
