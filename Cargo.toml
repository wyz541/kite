[package]
name = "kite-explorer"
version = "0.6.75"
edition = "2024"
description = "A fast, native cross-platform file manager with a shared Rust Core, Windows GPUI UI, and native macOS SwiftUI UI with Liquid Glass"
license = "MIT"
build = "build.rs"

[lib]
name = "kite_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]

[[bin]]
name = "kite-explorer"
path = "src/main.rs"
required-features = ["windows-ui"]

[[bin]]
name = "kite-perf"
path = "src/bin/kite-perf.rs"
required-features = ["performance"]

[features]
windows-ui = ["dep:gpui-kit", "dep:raw-window-handle"]
uniffi-bindgen = ["uniffi/cli"]
performance = []

[dependencies]
atomicwrites = "0.4.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
flate2 = "1.1.10"
dirs = "6"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
notify = "8.2.0"
open = "5"
regex = "1"
semver = "1"
sysinfo = "0.39.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
thiserror = "2"
thread-priority = "3.1.1"
trash = "5"
uniffi = "0.32.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
walkdir = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
futures-channel = "0.3"
libloading = "0.8.9"
gpui-kit = { version = "0.8.0", optional = true, features = ["syntect"] }
raw-window-handle = { version = "0.6.2", optional = true }
winreg = "0.56"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Search",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
panic = "abort"
strip = "symbols"
