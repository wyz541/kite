[package]
name = "kite-explorer"
version = "0.6.30"
edition = "2024"
description = "A fast, native cross-platform file manager with a shared Rust Core, Windows GPUI UI, and native macOS SwiftUI UI with Liquid Glass"
license = "MIT"
build = "build.rs"

[lib]
name = "kite_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-bindgen"]

[[bin]]
name = "kite-explorer"
path = "src/main.rs"
required-features = ["windows-ui"]

[features]
windows-ui = ["dep:gpui-kit", "dep:raw-window-handle"]
uniffi-bindgen = ["uniffi/cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
dirs = "6"
open = "5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
trash = "5"
uniffi = "0.32.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
walkdir = "2"

[target.'cfg(target_os = "windows")'.dependencies]
futures-channel = "0.3"
gpui-kit = { version = "0.8.0", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
winreg = "0.56"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.39.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
panic = "abort"
strip = "symbols"
