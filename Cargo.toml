[package]
name = "kite-explorer"
version = "0.2.1"
edition = "2024"
description = "A fast, native Windows file explorer built with Rust and GPUI"
license = "MIT"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
dirs = "6"
gpui-kit = "0.8.0"
open = "5"
trash = "5"
walkdir = "2"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
panic = "abort"
strip = "symbols"
