name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows GPUI
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core tests
        run: cargo test --locked --lib

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --features windows-ui -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release --features windows-ui

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: kite-windows
          path: target/release/kite-explorer.exe
          if-no-files-found: error

  macos:
    name: macOS SwiftUI + AppKit
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core tests
        run: cargo test --locked --lib

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify native UI boundary
        run: |
          cargo tree --locked > "$RUNNER_TEMP/macos-dependencies.txt"
          if grep -E '(^|[^[:alnum:]_-])(gpui|egui)([^[:alnum:]_-]|$)' "$RUNNER_TEMP/macos-dependencies.txt"; then
            echo "::error::macOS dependency graph contains gpui or egui"
            exit 1
          fi
          if grep -R -E -i 'gpui|egui' apps/macos/Sources; then
            echo "::error::macOS Swift sources contain gpui or egui"
            exit 1
          fi

      - name: Build SwiftUI application
        run: bash apps/macos/build.sh

      - name: Package macOS application
        run: ditto -c -k --sequesterRsrc --keepParent apps/macos/build/Kite.app Kite-macOS-arm64.zip

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: kite-macos
          path: Kite-macOS-arm64.zip
          if-no-files-found: error
