name: Core CI

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - build.rs
      - .cargo/**
      - src/**
      - build.ps1
      - README.md
      - docs/**
      - .gitignore
      - .github/workflows/ci.yml
      - .github/scripts/**
  pull_request:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - build.rs
      - .cargo/**
      - src/**
      - build.ps1
      - README.md
      - docs/**
      - .gitignore
      - .github/workflows/ci.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check privacy
        run: python3 .github/scripts/check-privacy.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check feature matrix
        run: bash .github/scripts/check-feature-matrix.sh

      - name: Run core tests
        run: cargo test --locked --lib
