name: Release parity

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v0.6.40
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  release-parity:
    name: Release parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/check-feature-matrix.sh
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.release_tag }}"
          else
            version="${{ github.ref_name }}"
          fi
          bash .github/scripts/check-release-parity.sh "$version"
