name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - apps/macos/**
      - assets/kite.icns
      - .github/workflows/macos.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - build.rs
      - .cargo/**
      - src/lib.rs
      - src/ffi.rs
      - src/fs.rs
      - src/session.rs
      - src/text_editor.rs
      - src/vcs.rs
      - src/favorites.rs
      - src/devices.rs
      - src/updater.rs
      - src/platform/**
      - src/bin/uniffi-bindgen.rs
      - apps/macos/**
      - assets/kite.icns
      - .github/workflows/macos.yml
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS SwiftUI + AppKit
    # PRs run the full build only when the ci:full label is added.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test directory watcher
        run: bash apps/macos/test-directory-watcher.sh

      - name: Verify native UI boundary
        run: |
          cargo tree --locked > "$RUNNER_TEMP/macos-dependencies.txt"
          if grep -E '(^|[^[:alnum:]_-])(gpui|egui)([^[:alnum:]_-]|$)' "$RUNNER_TEMP/macos-dependencies.txt"; then
            echo "::error::macOS dependency graph contains gpui or egui"
            exit 1
          fi
          if grep -R -E -i 'gpui|egui' apps/macos/Sources; then
            echo "::error::macOS Swift sources contain gpui or egui"
            exit 1
          fi

      - name: Verify Liquid Glass SDK
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $SDK_VERSION"
          case "$SDK_VERSION" in
            26.*|27.*) ;;
            *)
              echo "::error::Liquid Glass requires the macOS 26 SDK or newer"
              exit 1
              ;;
          esac
          grep -q "glassEffect" apps/macos/Sources/GlassSurface.swift

      - name: Build SwiftUI application
        env:
          KITE_BUILD_PROFILE: debug
        run: bash apps/macos/build.sh
