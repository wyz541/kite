name: Platform parity

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: platform-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  platform-parity:
    name: Platform parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check feature matrix
        run: bash .github/scripts/check-feature-matrix.sh

      - name: Check platform labels and coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/check-platform-parity.sh             "${{ github.event.pull_request.base.sha }}"             "${{ github.event.pull_request.head.sha }}"             "${{ github.event.pull_request.number }}"
