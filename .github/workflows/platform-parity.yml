name: Platform parity

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  platform-parity:
    name: Platform parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check platform labels and coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/check-platform-parity.sh             "${{ github.event.pull_request.base.sha }}"             "${{ github.event.pull_request.head.sha }}"             "${{ github.event.pull_request.number }}"
